id: io.github.bothlab.pomidaq
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: pomidaq
rename-icon: pomidaq
rename-desktop-file: pomidaq.desktop

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/srv

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la

modules:
  - name: openblas
    no-autogen: true
    make-args:
      - DYNAMIC_ARCH=1
      - FC=gfortran
      - NO_LAPACKE=1
      - USE_OPENMP=1
      - NO_WARMUP=1
      - NUM_THREADS=128
    make-install-args:
      - PREFIX=/app
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/archive/v0.3.34.tar.gz
        sha512: b40b5a3b5062ea196b3e48363db584ef91aef21c61becf4f4d6616ba5e413d770c22445c357d06dcf0992dd4666c18cced44cd5d09d8cb884c0d8f62e6940422
        x-checker-data:
          type: anitya
          project-id: 2540
          url-template: https://github.com/OpenMathLib/OpenBLAS/archive/v$version.tar.gz

  - name: opencv
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DOPENCV_GENERATE_PKGCONFIG=ON
      - -DWITH_OPENCL=ON
      - -DWITH_OPENGL=ON
      - -DWITH_TBB=ON
      - -DWITH_OPENMP=ON
      - -DWITH_VULKAN=ON
      - -DWITH_LAPACK=ON
      - -DBUILD_WITH_DEBUG_INFO=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_PERF_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DINSTALL_C_EXAMPLES=OFF
      - -DINSTALL_PYTHON_EXAMPLES=OFF
      - -DWITH_1394=OFF
      - -DWITH_V4L=ON
      - -DWITH_PROTOBUF=ON
      - -DWITH_QT=OFF
      - -DWITH_GTK=OFF
      - -DBUILD_LIST=core,features2d,flann,highgui,imgcodecs,imgproc,ml,objdetect,photo,stitching,video,videoio
    build-options:
      env:
        BLAS: /app/lib
        LAPACK: /app/lib
      arch:
        x86_64:
          config-opts:
            - -DCPU_BASELINE=AVX2
            - -DCPU_DISPATCH=AVX,AVX2
        aarch64:
          config-opts:
            - -DWITH_CAROTENE=OFF # fails on Flathub ARM builders and is only relevant for ARM
    cleanup:
      - bin
    sources:
      - type: archive
        url: https://github.com/opencv/opencv/archive/refs/tags/4.14.0.tar.gz
        sha256: ee8fb9b30eb60850431b4656447080e3737b56e45719c92b67f245950609f86e
      - type: archive
        url: https://github.com/opencv/opencv_contrib/archive/refs/tags/4.14.0.tar.gz
        sha256: 4f17abd1bc7f88e19c3380c8de7cbf2d863aced5b5ee8d8934cc7902b67d42c9

  - name: nlohmann-json
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DJSON_BuildTests=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz
        sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187
        x-checker-data:
          type: anitya
          project-id: 11152
          url-template: https://github.com/nlohmann/json/archive/refs/tags/v$version.tar.gz

  - name: pomidaq
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DPYTHON=OFF
    sources:
      - type: git
        url: https://github.com/bothlab/pomidaq.git
        tag: v1.0.0
